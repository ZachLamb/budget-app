# fallow.toml — CI runs `fallow dead-code` (hard fail on errors).
# Full `fallow` (dupes/health) is for periodic audits via code-quality-audit skill.
# https://docs.fallow.tools

# run-ai-jobs.mjs is a standalone CLI (see `npm run ai:run-jobs`) — it is
# invoked by the user, not imported by the app, so it has no in-tree consumer.
entry = ["public/sw.js", "src/lib/llm/index.ts", "scripts/run-ai-jobs.mjs"]

ignoreExportsUsedInFile = true

[[ignoreExports]]
file = "src/components/ui/**"
exports = ["*"]

[rules]
unused-files = "error"
unused-exports = "error"
unused-types = "error"
unlisted-dependencies = "error"
duplicate-exports = "error"
unused-dependencies = "warn"

[duplicates]
enabled = false

[health]
maxCyclomatic = 999
maxCognitive = 999
