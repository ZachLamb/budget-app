# Render Blueprint for the Snack's Budget FastAPI backend.
# Deploy: Render dashboard -> New -> Blueprint -> point at this repo. This
# file MUST live at the repo root — Render's Blueprint scanner does not look
# in subdirectories. Builds from backend/Dockerfile (entrypoint.sh runs
# `alembic upgrade head` before uvicorn, same as the Fly deploy did).
#
# Postgres is NOT defined here — this app was moved off Fly's paid Postgres
# to Neon's free tier instead. Create a Neon project, copy its pooled
# connection string, and paste it into DATABASE_URL / DATABASE_URL_SYNC below
# after the first deploy (Render blueprint env vars with `sync: false` are
# prompted for in the dashboard, never committed).
#
# See docs/deployment-security-checklist.md for the full secrets list.

services:
  - type: web
    name: budget-app-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /api/health
    envVars:
      # backend/entrypoint.sh hardcodes `uvicorn --port 8000`; PORT tells
      # Render's proxy which port to route to (Docker services don't infer
      # this from the Dockerfile).
      - key: PORT
        value: "8000"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_URL_SYNC
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: DEMO_MODE
        value: "false"
      # Google sign-in. The backend gates the button and the /api/auth/google
      # route on GOOGLE_CLIENT_ID; unset means "disabled" and the route 501s.
      # The OAuth redirect_uri is built from FRONTEND_URL, not from this
      # service's host: the browser starts the flow on the frontend origin and
      # the oauth_state cookie is scoped there, so the callback must be on that
      # same origin (the frontend proxies /api back here). Register that exact
      # URI in the Google console.
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      # Optional — leave unset to disable. See .env.example for the full list
      # (Google OAuth, Resend, Upstash rate-limit store, LLM_BACKEND_*, etc.)
